<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#f1f5f9">
  <title>卢米亚铭牌工坊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@600;700;900&family=Orbitron:wght@700;800&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css?v=1.2.0">
</head>
<body data-theme="light">
  <header class="topbar">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true">铭</div>
      <div class="brand-titles">
        <h1>卢米亚铭牌工坊</h1>
        <p>永恒轮回 · 角色铭牌与大厅搭配</p>
      </div>
      <button class="version-button" id="changelogButton" type="button" title="查看版本更新日志">
        <span id="versionLabel">v1.2.0</span>
        <span class="version-extra">· 更新日志</span>
      </button>
    </div>

    <nav class="mode-tabs" aria-label="编辑模式">
      <button class="mode-tab active" data-mode="role" type="button">
        <span class="tab-index">01</span><span>单人铭牌</span>
      </button>
      <button class="mode-tab" data-mode="squad" type="button">
        <span class="tab-index">02</span><span>加载连排</span>
      </button>
      <button class="mode-tab" data-mode="team" type="button">
        <span class="tab-index">03</span><span>队伍大厅</span>
      </button>
    </nav>

    <div class="topbar-actions">
      <button class="icon-button" id="themeToggle" type="button" title="切换明暗主题" aria-label="切换明暗主题">☾</button>
      <button class="secondary-button share-trigger-btn" id="shareButton" type="button" title="一键生成包含边框、头像、背景、皮肤名称清单的搭配分享图">✦ <span class="btn-lbl-full">生成搭配图</span><span class="btn-lbl-short">搭配图</span></button>
      <button class="secondary-button" id="copyButton" type="button" title="复制纯铭牌高清透明 PNG 到剪贴板"><span class="btn-lbl-full">复制图片</span><span class="btn-lbl-short">复制</span></button>
      <button class="export-button" id="exportButton" type="button"><span aria-hidden="true">↓</span> <span class="btn-lbl-full">导出高清 PNG</span><span class="btn-lbl-short">导出 PNG</span></button>
    </div>
  </header>

  <main class="workspace" id="workspaceMain">
    <section class="preview-area" id="previewArea" data-stage-bg="auto">
      <div class="preview-head">
        <div class="preview-head-titles">
          <span class="eyebrow" id="previewEyebrow">单人角色加载界面</span>
          <h2 id="previewTitle">角色加载铭牌</h2>
        </div>
        <div class="preview-head-right">
          <div class="stage-bg-pills" role="group" aria-label="预览舞台底衬" title="仅切换左侧预览舞台底色，方便检查浅色/深色发光边框与透明边缘">
            <button type="button" class="stage-bg-btn active" data-stage-bg="auto">默认</button>
            <button type="button" class="stage-bg-btn" data-stage-bg="dark">暗场</button>
            <button type="button" class="stage-bg-btn" data-stage-bg="light">纯白</button>
            <button type="button" class="stage-bg-btn" data-stage-bg="checker">透明格</button>
          </div>
          <div class="preview-meta">
            <span class="live-dot"></span>
            <span class="preview-status-text" id="previewStatus">1:1 实机比例预览</span>
            <span class="meta-divider"></span>
            <span id="slotSummary">半身模式</span>
          </div>
          <button class="mobile-expand-btn" id="mobilePreviewToggle" type="button">放大预览</button>
        </div>
      </div>

      <div class="preview-stage" id="previewStage">
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <div class="preview-footer">
        <div class="footer-note">
          <span class="footer-marker">+</span>
          <span>本地实时合成，边框外溢装饰完整保留，导出高清 PNG 支持透明通道。</span>
        </div>
        <div class="key-hint"><kbd>1</kbd> 单人铭牌 <kbd>2</kbd> 加载连排 <kbd>3</kbd> 队伍大厅</div>
      </div>
    </section>

    <aside class="control-panel">
      <div class="panel-scroll">
        <!-- 单人铭牌 & 三人加载连排共用编辑区 -->
        <section class="editor-section" id="rolePanel">
          <div class="section-heading">
            <div>
              <span class="section-kicker" id="rolePanelKicker">加载界面铭牌</span>
              <h3 id="rolePanelHeading">角色铭牌搭配</h3>
            </div>
            <div class="section-heading-actions">
              <button class="fav-toggle-btn" id="favDrawerBtn" type="button" title="打开我的铭牌收藏夹">★ 收藏夹 <span id="favCountBadge">0</span></button>
              <button class="inspire-button" id="randomRoleBtn" type="button" title="围绕当前实验体随机搭配一套皮肤、边框、背景与头像">✦ 随机搭配</button>
              <span class="section-count" id="rolePanelModeBadge">单人</span>
            </div>
          </div>

          <div class="favorites-drawer" id="favoritesDrawer" hidden></div>
          <div id="squadControlHead" hidden></div>
          <div id="roleEditor"></div>
        </section>

        <!-- 队伍大厅编辑区 -->
        <section class="editor-section" id="teamPanel" hidden>
          <div class="section-heading">
            <div>
              <span class="section-kicker">组队准备界面</span>
              <h3>队伍大厅配置</h3>
            </div>
            <div class="section-heading-actions">
              <button class="inspire-button" id="randomTeamBtn" type="button" title="为当前选中的队友槽位随机抽取一套背景与头像">✦ 随机本槽</button>
              <span class="section-count" id="teamCount">03/04</span>
            </div>
          </div>
          <div class="slot-tabs" id="teamSlotTabs"></div>
          <div id="teamEditor"></div>
        </section>
      </div>

      <div class="panel-bottom">
        <button class="reset-button" id="resetButton" type="button">↺ 重置全套初始方案</button>
        <span class="asset-count" id="assetCount">素材载入中</span>
      </div>
    </aside>
  </main>

  <div class="modal-backdrop" id="changelogBackdrop" hidden>
    <div class="changelog-modal" role="dialog" aria-modal="true" aria-labelledby="changelogTitle">
      <div class="changelog-head">
        <h3 id="changelogTitle">卢米亚铭牌工坊 · 版本更新日志</h3>
        <button class="changelog-close" id="changelogClose" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="changelog-body" id="changelogBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="shareBackdrop" hidden>
    <div class="share-modal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
      <div class="changelog-head">
        <div class="share-head-left">
          <h3 id="shareModalTitle">铭牌搭配分享图预览</h3>
          <div class="share-theme-switch" role="group" aria-label="分享图底色">
            <button type="button" class="share-theme-btn active" data-share-theme="light">清爽白卡</button>
            <button type="button" class="share-theme-btn" data-share-theme="dark">深邃黑卡</button>
          </div>
        </div>
        <button class="changelog-close" id="shareClose" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="share-preview-wrap" id="sharePreviewWrap">
        <div class="share-loading" id="shareLoading">正在合成高清搭配清单图…</div>
        <img id="sharePreviewImg" alt="铭牌搭配分享图预览" hidden>
      </div>
      <div class="share-foot">
        <span class="share-foot-hint" id="shareFootHint">自动附上当前实验体、皮肤、边框、背景与头像官方名称（手机端可直接长按上方图片保存）</span>
        <div class="share-foot-actions">
          <button type="button" class="secondary-button" id="shareCopyBtn">复制图片</button>
          <button type="button" class="export-button" id="shareDownloadBtn"><span aria-hidden="true">↓</span> 保存 PNG</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="extracted_assets/assets.js?v=1.2.0"></script>
  <script src="app.js?v=1.2.0"></script>
</body>
</html>
